openapi: 3.0.3
info:
  title: Leaderboard API — лидерборд игрового рейтинга
  version: 1.0.0
  description: |
    Учебный API таблицы лидеров. Игровой сервер начисляет игрокам очки,
    а клиенты читают топ игроков и позицию конкретного игрока.

    **Сезон.** Очки считаются в рамках текущего сезона. Сброс сезона обнуляет
    таблицу, прошлые результаты при этом сохраняются в архиве.

    **Доступ.** Чтение открыто всем. Начисление очков требует ключа игрового
    сервера (`X-API-Key`), сброс сезона — токена администратора (`X-Admin-Token`).
servers:
  - url: http://localhost:8000
    description: Локальный stub-сервер (src/server.py)
tags:
  - name: Leaderboard
    description: Чтение таблицы лидеров
  - name: Scores
    description: Начисление очков
  - name: Season
    description: Управление сезоном

paths:
  /health:
    get:
      tags: [Leaderboard]
      operationId: getHealth
      summary: Проверка доступности сервиса
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /leaderboard:
    get:
      tags: [Leaderboard]
      operationId: getLeaderboard
      summary: Топ-K игроков текущего сезона
      description: |
        Игроки отсортированы по убыванию очков. При равенстве очков выше тот,
        кто набрал их раньше.
      parameters:
        - name: k
          in: query
          description: Сколько игроков вернуть
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Топ игроков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
        '400':
          $ref: '#/components/responses/BadRequest'

  /players/{nickname}:
    get:
      tags: [Leaderboard]
      operationId: getPlayer
      summary: Игрок по нику (очки и место в рейтинге)
      parameters:
        - $ref: '#/components/parameters/Nickname'
      responses:
        '200':
          description: Данные игрока
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '404':
          $ref: '#/components/responses/NotFound'

  /scores:
    post:
      tags: [Scores]
      operationId: addScore
      summary: Начислить игроку очки
      description: |
        Прибавляет `points` к очкам игрока в текущем сезоне. Если игрока ещё нет
        в таблице, он создаётся. Очки только прибавляются: уменьшить их нельзя.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreUpdate'
            example:
              nickname: NeoKnight
              points: 250
      responses:
        '200':
          description: Очки начислены, возвращается обновлённый игрок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /season:
    get:
      tags: [Season]
      operationId: getSeason
      summary: Информация о текущем сезоне
      responses:
        '200':
          description: Текущий сезон
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'

  /season/reset:
    post:
      tags: [Season]
      operationId: resetSeason
      summary: Сбросить сезон (только администратор)
      description: |
        **Осторожно: необратимая для текущей таблицы операция.** Все очки
        обнуляются, начинается новый сезон. Результаты завершённого сезона
        сохраняются в архиве. Чтобы исключить случайный вызов, в теле запроса
        нужно явно передать `confirm: true`.
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonResetRequest'
            example:
              confirm: true
      responses:
        '200':
          description: Сезон сброшен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResetResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Ключ игрового сервера, которому разрешено начислять очки
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Токен администратора для управления сезоном

  parameters:
    Nickname:
      name: nickname
      in: path
      required: true
      description: Ник игрока (без учёта регистра)
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{3,20}$'
      example: NeoKnight

  schemas:
    Player:
      type: object
      required: [nickname, score, rank, updated_at]
      properties:
        nickname:
          type: string
          example: NeoKnight
        score:
          type: integer
          minimum: 0
          description: Сумма очков в текущем сезоне
          example: 1250
        rank:
          type: integer
          minimum: 1
          description: Место в таблице (1 — лидер)
          example: 3
        updated_at:
          type: string
          format: date-time
          description: Когда игрок набрал текущее количество очков
    LeaderboardEntry:
      type: object
      required: [rank, nickname, score]
      properties:
        rank:
          type: integer
          minimum: 1
          example: 1
        nickname:
          type: string
          example: NeoKnight
        score:
          type: integer
          example: 1250
    Leaderboard:
      type: object
      required: [season, entries]
      properties:
        season:
          type: integer
          description: Номер текущего сезона
          example: 1
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    ScoreUpdate:
      type: object
      required: [nickname, points]
      properties:
        nickname:
          type: string
          pattern: '^[A-Za-z0-9_-]{3,20}$'
          description: 3–20 символов, латиница, цифры, «_» и «-»
        points:
          type: integer
          minimum: 1
          maximum: 10000
          description: Сколько очков прибавить за одну операцию
    Season:
      type: object
      required: [id, started_at, players_count]
      properties:
        id:
          type: integer
          example: 1
        started_at:
          type: string
          format: date-time
        players_count:
          type: integer
          description: Сколько игроков в таблице текущего сезона
          example: 42
    SeasonResetRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Должно быть true, иначе сброс не выполняется
    SeasonResetResult:
      type: object
      required: [previous_season, new_season, archived_players]
      properties:
        previous_season:
          type: integer
          example: 1
        new_season:
          type: integer
          example: 2
        archived_players:
          type: integer
          description: Сколько результатов попало в архив
          example: 42
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid nickname

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Ключ или токен не указан либо неверен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Игрок не найден в текущем сезоне
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
