name: leaderboard

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: leaderboard-api:1.0
    container_name: leaderboard-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LEADERBOARD_API_KEY: ${LEADERBOARD_API_KEY:-change-me}
    depends_on:
      redis:
        condition: service_healthy   # API стартует, только когда Redis отвечает на ping
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - leaderboard-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: leaderboard-redis
    command: ["redis-server", "--appendonly", "yes"]   # очки переживают перезапуск
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - leaderboard-net
    restart: unless-stopped
    # порт Redis наружу не публикуется: доступ только из сети leaderboard-net

volumes:
  redis-data:

networks:
  leaderboard-net:
    name: leaderboard-net
